<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT209 - Demo HTML 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333333;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
        .info-item {
            margin: 15px 0;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            text-align: left;
        }
        .label {
            font-size: 0.85rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2b2d42;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Thông Tin Sinh Viên</h1>
        
        <div class="info-item">
            <div class="label">Họ và Tên</div>
            <div class="value">[Họ và Tên của bạn]</div>
        </div>

        <div class="info-item">
            <div class="label">Trường</div>
            <div class="value">[Tên Trường của bạn]</div>
        </div>
    </div>
</body>
</html>
